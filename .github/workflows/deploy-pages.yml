name: 기상청 날씨 갱신 및 Pages 배포

on:
  push:
    branches: [master]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 공개 회귀 테스트
        run: |
          node tools/test-column-publisher.mjs
          node tools/test-columns-serp.mjs
          node tools/test-seo-surfaces.mjs
          node tools/test-medical-editorial-trust.mjs
          node tools/test-naver-tracking.mjs
          node tools/test-dear-ai.mjs
          node tools/test-dear-ai-public.mjs
      - uses: actions/configure-pages@v5
      - name: 공개 사이트 구성
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='admin-app' --exclude='_site' --exclude='*.patch' ./ _site/
      - name: 마지막 정상 날씨 보존
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 10 https://dearhani.com/weather-data.json -o /tmp/weather-data.json
          node -e "const fs=require('fs');const data=JSON.parse(fs.readFileSync('/tmp/weather-data.json','utf8'));if(!data.observedAt)process.exit(1);fs.copyFileSync('/tmp/weather-data.json','_site/weather-data.json')"
      - name: 기상청 현재 날씨 저장
        id: weather
        continue-on-error: true
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: node tools/fetch-kma-weather.mjs _site/weather-data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 기상청 갱신 실패 안내
        if: steps.weather.outcome == 'failure'
        run: echo "::warning::기상청 날씨 갱신에 실패했습니다. Pages는 마지막 정상 날씨와 함께 배포되었습니다."
