<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEAR COLUMN EDITOR</title><link rel="stylesheet" href="/editor/editor.css"></head>
<body>
<header class="topbar"><a class="brand">DEAR <span>COLUMN</span></a><p id="saveState">새 글을 시작해 주세요</p><div class="top-actions"><button id="saveButton">저장</button><button id="previewButton">미리보기</button><button class="publish" id="settingsButton">검토하고 공개</button></div></header>
<nav class="insertbar" aria-label="내용 넣기"><span>넣기</span><button data-insert="image">▧ 사진</button><button data-insert="h2">H 소제목</button><button data-insert="quote">❝ 인용</button><button data-insert="keypoint">◆ 핵심문장</button><button data-insert="ul">☷ 목록</button><button data-insert="table">▦ 표</button><button data-insert="hr">─ 구분선</button></nav>
<main class="workspace"><section class="writing-area"><div class="paper">
<textarea id="title" class="title" rows="2" placeholder="제목"></textarea><textarea id="summary" class="summary" rows="2" placeholder="독자가 이 글에서 얻을 답을 두 문장 안으로 소개해 주세요"></textarea>
<div class="mode-row"><div><button class="mode is-active" data-mode="visual">기본 글쓰기</button><button class="mode" data-mode="html">HTML</button></div><span>목차 · 상담 안내 · 병원 정보는 자동 구성되고, FAQ는 직접 입력한 경우에만 표시돼요.</span></div>
<div class="formatbar" aria-label="글자 꾸미기"><select id="blockStyle" title="문단 모양"><option value="p">본문</option><option value="h2">큰 소제목</option><option value="h3">작은 소제목</option><option value="blockquote">인용문</option></select><select id="fontSize" title="글자 크기" aria-label="글자 크기"><option value="">크기</option><option>11</option><option>13</option><option selected>15</option><option>16</option><option>19</option><option>24</option><option>28</option><option>30</option><option>34</option><option>38</option></select><button data-command="bold" title="굵게"><b>B</b></button><button data-command="italic" title="기울임"><i>I</i></button><button data-command="underline" title="밑줄"><u>U</u></button><button data-command="strikeThrough" title="취소선"><s>S</s></button><i></i><button data-command="justifyLeft" title="왼쪽 정렬">≡</button><button data-command="justifyCenter" title="가운데 정렬">≣</button><button data-command="justifyRight" title="오른쪽 정렬">≡</button><button data-command="insertUnorderedList" title="글머리표">☷</button><button data-command="insertOrderedList" title="번호 목록">1.</button><button id="linkButton" title="링크">🔗</button><button id="textColorButton" title="글자색">A</button><button id="backColorButton" title="글자 배경색">▣</button><button data-command="undo" title="실행 취소">↶</button><button data-command="redo" title="다시 실행">↷</button></div>
<div id="palette" class="palette" hidden></div>
<div id="tablebar" class="tablebar" hidden><strong><span id="cellCount">1칸</span> 선택</strong><button data-table="undo">표 작업 취소</button><button data-table="merge">병합</button><button data-table="split">분리</button><button data-table="split-all">모든 병합 해제</button><button data-table="cell-back">셀 배경색</button><button data-table="cell-text">글자색</button><i></i><button data-table="row-after">아래 행 +</button><button data-table="col-after">오른쪽 열 +</button><button data-table="row-delete">행 삭제</button><button data-table="col-delete">열 삭제</button><button data-table="header">제목 셀</button><button data-table="table-delete">표 삭제</button></div>
<div id="visualEditor" class="visual-editor" contenteditable="true" data-placeholder="여기를 눌러 글을 시작하세요."></div><textarea id="htmlEditor" class="html-editor" spellcheck="false" hidden placeholder="본문에 들어갈 HTML만 붙여 넣어 주세요."></textarea>
</div></section></main>
<input id="bodyImageFile" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<aside id="settingsPanel" class="panel" aria-hidden="true"><header><div><small>PUBLISH</small><h2>글 검토와 발행</h2></div><button id="closeSettings" aria-label="닫기">×</button></header><div class="panel-scroll">
<label>글 주소용 영문 이름<input id="slug" placeholder="sleep-daily-rhythm"></label><div class="two"><label>분류<select id="category"><option value="Focus">집중</option><option value="Calm">마음</option><option value="Restore">채움</option><option value="Relief">불편</option><option value="Shape">변화</option></select></label><label>글쓴이<select id="editorName"><option>김민지</option><option>박성호</option></select></label></div><label>게시일<input id="publishedAt" type="date"></label><label>검색 주제 태그<input id="tags" placeholder="피로, 생활 리듬, 수면"></label><label>대표 사진<input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label>대표 사진 설명<input id="coverAlt" placeholder="사진에 보이는 장면을 설명해 주세요"></label>
<section><div class="section-head"><h3>자주 묻는 질문</h3><button id="addFaq">+ 추가</button></div><div id="faqs"></div></section><section><div class="section-head"><h3>참고한 의학 자료</h3><button id="addSource">+ 추가</button></div><div id="sources"></div></section>
</div><footer><button id="panelPreview">홈페이지 모습 확인</button><button class="publish" id="publishButton">홈페이지에 공개</button></footer></aside><div id="scrim" class="scrim" hidden></div>
<section id="previewModal" class="preview-modal" hidden><header><strong>홈페이지 모습 확인</strong><div><button data-width="desktop" class="is-active">PC</button><button data-width="mobile">모바일</button><button id="closePreview">닫기</button></div></header><div class="preview-stage"><iframe id="preview" title="칼럼 미리보기"></iframe></div></section>
<div id="toast" class="toast" role="status"></div><script src="/editor/editor.js"></script></body></html>
