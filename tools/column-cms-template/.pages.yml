# 디어한의원 칼럼 관리자 설정 v3
media:
  - name: column_images
    label: 칼럼 사진 보관함
    input: media/columns
    output: media/columns
    rename: safe
    extensions: [jpg, jpeg, png, webp]
    categories: [image]

settings:
  hide: true
  commit:
    identity: app
    templates:
      create: "칼럼 초안 저장: {name}"
      update: "칼럼 초안 수정: {name}"
      delete: "칼럼 초안 삭제: {name}"

content:
  - name: columns
    label: 칼럼 작성·관리
    type: collection
    path: content/columns
    format: json
    exclude: [".gitkeep"]
    filename:
      template: "{fields.slug}.json"
      field: false
    operations:
      create: true
      rename: false
      delete: false
    view:
      fields: [title, status, publishedAt, editorName]
      primary: title
      sort: [modifiedAt, publishedAt, title]
      default:
        sort: modifiedAt
        order: desc
    fields:
      - name: title
        label: 칼럼 제목
        type: string
        required: true
        description: >-
          오른쪽 위 Save는 비공개 초안 임시저장입니다. Save만 눌러서는 홈페이지에 공개되지 않습니다. 이 제목은 홈페이지 칼럼 목록과 글 첫 화면, 검색 결과에 쓰입니다. 독자가 어떤 고민의 답을 얻는지 자연스럽고 구체적으로 적어 주세요. 예: 잠이 오지 않는 밤, 생활 리듬부터 살펴보는 이유
        options:
          minlength: 5
          maxlength: 100

      - name: slug
        label: 글 주소용 영문 이름
        type: string
        required: true
        description: >-
          이 글만의 인터넷 주소가 됩니다. 영문 소문자·숫자·하이픈(-)만 사용하고, 발행 후에는 검색 연결이 끊길 수 있으므로 바꾸지 않습니다. 예: sleep-daily-rhythm
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: "영문 소문자·숫자·하이픈만 입력해 주세요. 예: sleep-daily-rhythm"

      - name: editorName
        label: 글쓴이
        type: select
        required: true
        description: >-
          칼럼에 작성자로 표시되어 독자에게 글의 책임자와 전문성을 알려 줍니다. 실제로 내용을 작성하거나 최종 검수한 사람을 선택해 주세요.
        options:
          placeholder: 글쓴이를 선택하세요
          values:
            - name: 박성호
              label: 박성호
            - name: 김민지
              label: 김민지 대표원장

      - name: category
        label: 칼럼 분류
        type: select
        required: true
        description: >-
          홈페이지 Columns에서 글을 주제별로 찾을 때 사용합니다. 검색하려는 단어가 아니라 글의 중심 내용과 가장 가까운 분류 하나를 선택해 주세요.
        options:
          placeholder: 글의 주제를 선택하세요
          values:
            - name: Focus
              label: 집중
            - name: Calm
              label: 마음
            - name: Restore
              label: 채움
            - name: Relief
              label: 불편
            - name: Shape
              label: 변화

      - name: summary
        label: 목록에 보일 한 줄 소개
        type: text
        required: true
        description: >-
          홈페이지 칼럼 목록에서 제목 아래에 보이며, 독자가 글을 열어 볼지 판단하게 하는 문장입니다. 누구의 어떤 고민을 다루고 무엇을 알려 주는지 1~2문장으로 적어 주세요. 예: 잠드는 시간이 들쭉날쭉할 때 수면 시간만큼 먼저 살펴볼 생활 리듬을 설명합니다.
        options:
          minlength: 20
          maxlength: 220

      - name: tags
        label: 검색 주제 태그 (선택)
        type: string
        description: >-
          홈페이지에서 관련 주제를 보여 주고 칼럼 검색에 활용합니다. 검색 순위를 올리는 해시태그 칸은 아니므로 핵심 주제만 2~5개 적어 주세요. # 기호는 쓰지 않아도 됩니다. 예: 공진단, 피로, 생활 리듬
        list:
          max: 5
        options:
          minlength: 2
          maxlength: 30

      - name: coverImage
        label: 목록과 첫 화면의 대표 사진
        type: image
        required: true
        description: >-
          홈페이지 칼럼 목록 카드와 글 첫 화면에 보여 첫인상을 만듭니다. 글의 주제와 직접 연결되는 가로형 사진을 선택해 주세요. 사진 안에 긴 글자를 넣으면 모바일에서 읽기 어렵습니다.
        options:
          media: column_images
          path: media/columns
          extensions: [jpg, jpeg, png, webp]
          rename: safe

      - name: coverAlt
        label: 대표 사진을 글로 설명
        type: string
        required: true
        description: >-
          사진을 볼 수 없는 독자의 화면 읽기 기능에 전달되며, 검색엔진도 이미지의 내용을 이해하는 데 참고합니다. 키워드를 나열하지 말고 보이는 장면을 짧게 적어 주세요. 예: 침대 옆 조명 아래 놓인 책과 따뜻한 차

      - name: body
        label: 칼럼 본문
        type: rich-text
        required: true
        description: >-
          독자가 실제로 읽는 글의 중심 부분입니다. 빈 화면을 누르면 바로 쓸 수 있고, '/'를 입력하면 소제목·목록·사진 같은 메뉴가 나옵니다. '제목 2'와 '제목 3' 중 어느 것을 사용해도 홈페이지에서는 기존 칼럼과 같은 소제목 디자인과 목차로 정리됩니다. 긴 글은 소제목으로 나누고, 의학적 효과를 단정하기보다 이해하기 쉬운 설명과 근거를 담아 주세요.
        options:
          format: markdown
          media: column_images
          path: media/columns
          extensions: [jpg, jpeg, png, webp]
          categories: [image]
          rename: safe
          switcher: false

      - name: lead
        label: 제목 아래 소개 문장 (선택)
        type: text
        required: false
        description: >-
          글을 열었을 때 제목 바로 아래에 크게 보이는 도입 문장입니다. 목록의 한 줄 소개와 다른 분위기로 독자를 본문에 이끌고 싶을 때만 적어 주세요. 비워 두면 위의 '목록에 보일 한 줄 소개'가 자동으로 들어갑니다.
        options:
          maxlength: 300

      - name: description
        label: 검색 결과용 글 설명 (선택)
        type: text
        required: false
        description: >-
          Google·NAVER와 공유 링크가 이 글의 내용을 이해할 때 참고하는 설명입니다. 검색 화면에 항상 그대로 나오지는 않습니다. 핵심 주제와 독자가 얻을 정보를 자연스럽게 80~160자로 적고, 비워 두면 '목록에 보일 한 줄 소개'를 자동으로 사용합니다.
        options:
          maxlength: 180

      - name: faqs
        label: 환자가 자주 묻는 질문 (선택)
        type: object
        description: >-
          본문을 읽고도 남을 만한 실제 질문과 답을 추가합니다. 독자에게는 빠른 이해를 돕고, 검색엔진과 AI에는 글의 핵심 질의와 답을 명확히 전달합니다. 꼭 필요한 질문만 2~5개 정도 권장합니다.
        list:
          collapsible:
            collapsed: true
            summary: "{fields.question}"
        fields:
          - name: question
            label: 환자가 묻는 말
            type: string
            required: true
            description: >-
              환자가 실제로 검색하거나 진료실에서 물을 법한 문장으로 적어 주세요. 예: 잠드는 시간이 매일 다른 것도 살펴봐야 하나요?
          - name: answer
            label: 쉬운 답변
            type: text
            required: true
            description: >-
              질문에 바로 답한 뒤 필요한 설명을 덧붙입니다. 치료 효과를 보장하거나 모든 사람에게 같은 결론을 단정하지 않습니다.

      - name: sources
        label: 참고한 의학 자료 (선택)
        type: object
        description: >-
          글을 작성할 때 실제로 확인한 학회·공공기관·논문 등의 자료를 기록합니다. 독자에게 근거와 신뢰를 보여 주고, 나중에 내용을 다시 검토하기도 쉬워집니다.
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: 자료 이름
            type: string
            required: true
            description: >-
              독자가 어떤 자료인지 알 수 있는 정식 제목이나 기관명을 적어 주세요.
          - name: url
            label: 자료 원문 인터넷 주소
            type: string
            required: true
            description: >-
              블로그나 재가공 글보다 원 논문·학회·공공기관 페이지 주소를 우선합니다. 주소창의 https://부터 끝까지 복사해 넣어 주세요.
            pattern:
              regex: "^https://.+$"
              message: "https://로 시작하는 전체 인터넷 주소를 입력해 주세요."

      - name: status
        label: 저장·발행 상태
        type: select
        required: true
        default: draft
        description: >-
          '초안으로 저장'과 홈페이지 발행을 분리하는 안전장치입니다. 작성 중에는 초안으로 저장하고, 검토를 마친 뒤에만 '홈페이지 발행 준비 완료'로 바꿔 주세요. 상태만 바꿔서는 발행되지 않으며 마지막에 발행 버튼을 눌러야 합니다.
        options:
          placeholder: 현재 상태를 선택하세요
          values:
            - name: draft
              label: 초안으로 저장
            - name: review
              label: 검토 중
            - name: ready
              label: 홈페이지 발행 준비 완료

      - name: publishedAt
        label: 홈페이지에 처음 올리는 날짜
        type: date
        required: true
        description: >-
          칼럼 화면과 검색엔진에 최초 게시일로 전달됩니다. 보통 오늘 날짜를 선택합니다. 미래 날짜를 넣어도 예약 발행되지는 않습니다.
        options:
          format: yyyy-MM-dd

      - name: modifiedAt
        label: 내용을 마지막으로 고친 날짜 (선택)
        type: date
        required: false
        description: >-
          이미 발행한 글의 내용을 의미 있게 고쳤을 때 수정 날짜를 알려 줍니다. 처음 쓰는 글이거나 수정하지 않았다면 비워 두어도 되고, 그때는 최초 게시일을 자동으로 사용합니다.
        options:
          format: yyyy-MM-dd

    actions:
      - name: preview-column
        label: 미리보기 만들기
        scope: entry
        workflow: preview-column.yml
        ref: current
        cancelable: false
        confirm:
          title: 저장된 내용으로 홈페이지 미리보기를 만들까요?
          message: 먼저 오른쪽 위 Save를 눌러 최신 내용을 임시저장했는지 확인해 주세요. 미리보기는 칼럼 목록과 검색 사이트맵에 들어가지 않으며 검색엔진 노출을 차단합니다.
          button: 미리보기 만들기
      - name: publish-column
        label: 홈페이지에 발행
        scope: entry
        workflow: publish-column.yml
        ref: current
        cancelable: false
        confirm:
          title: 저장된 이 칼럼을 홈페이지에 발행할까요?
          message: '저장·발행 상태'가 '홈페이지 발행 준비 완료'인지 확인해 주세요. 저장된 최신 내용으로 홈페이지 칼럼, 목록, 검색용 사이트맵을 갱신합니다.
          button: 홈페이지에 발행
