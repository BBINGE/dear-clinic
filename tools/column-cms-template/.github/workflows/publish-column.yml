name: 디어 칼럼 발행

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS가 전달한 발행 정보
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dear-column-site-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 비공개 칼럼 원고 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: content-source

      - name: 공개 홈페이지 가져오기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BBINGE/dear-clinic
          ssh-key: ${{ secrets.DEAR_PUBLIC_REPO_SSH_KEY }}
          path: public-site

      - name: 발행할 원고 확인
        id: entry
        shell: bash
        env:
          PAGES_CMS_PAYLOAD: ${{ inputs.payload }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const payload = JSON.parse(process.env.PAGES_CMS_PAYLOAD);
          const entryPath = payload?.context?.path;
          if (!entryPath || !/^content\/columns\/[a-z0-9-]+\.json$/.test(entryPath)) {
            throw new Error("발행할 칼럼 파일을 확인할 수 없습니다.");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `path=${entryPath}\n`);
          NODE

      - name: 칼럼 페이지 생성
        run: >
          node public-site/tools/publish-column.mjs
          --content "content-source/${{ steps.entry.outputs.path }}"
          --media-root content-source
          --site-root public-site

      - name: 홈페이지 변경 검증
        working-directory: public-site
        run: |
          git diff --check
          test -z "$(git status --short -- HANDOFF.md)"
          test -n "$(git status --short -- columns.html sitemap.xml columns assets/images/columns)"

      - name: 홈페이지에 발행
        working-directory: public-site
        run: |
          git config user.name "디어 칼럼 발행기"
          git config user.email "column-publisher@users.noreply.github.com"
          git add -- columns.html sitemap.xml columns assets/images/columns
          git commit -m "칼럼 발행: ${{ steps.entry.outputs.path }}"
          git push origin master

      - name: 검색 등록 주소
        shell: bash
        env:
          ENTRY_PATH: ${{ steps.entry.outputs.path }}
        run: |
          SLUG="$(basename "$ENTRY_PATH" .json)"
          {
            echo "## 발행 완료"
            echo
            echo "게시물: https://dearhani.com/columns/$SLUG.html"
            echo
            echo "Google Search Console과 네이버 서치어드바이저에는 위 주소를 한 번씩 등록해 주세요."
          } >> "$GITHUB_STEP_SUMMARY"
